name: Deploy

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/htdocs/soilstructurebd.com

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 24

            git fetch origin deploy

            # Keep repo-only files (docs, CI config, dev scripts) out of the
            # server's working tree. Git still tracks them; they're just never
            # written here. Re-applied every deploy, so edit this list freely.
            git sparse-checkout set --no-cone \
              '/*' \
              '!/.github/' \
              '!/.gitignore' \
              '!/.env.example' \
              '!/CLAUDE.md' \
              '!/CONTINUE_HERE.md' \
              '!/scripts/'

            git reset --hard origin/deploy

            npm install
            npm run build

            pm2 flush
            pm2 delete soilstructurebd-web soilstructurebd-api || true
            pm2 start ecosystem.config.js
            pm2 save
